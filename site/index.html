<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WKE教務系統</title>

  <!-- 子路徑部署：必須和實際網址一致 -->
  <base href="/s114321026/">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. Header：左邊漢堡＋標題，右邊深色切換＋登入 -->
  <header class="top-header">
    <div class="header-left">
      <button type="button" id="menu-toggle" class="btn-menu" aria-label="切換選單" aria-expanded="false" aria-controls="sidebar">☰</button>
      <div class="header-title">WKE教務系統</div>
    </div>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="btn-theme">🌙 切換深色</button>
      <button type="button" class="btn-login">登入</button>
    </div>
  </header>

  <!-- 2. 主版面 -->
  <div class="layout-container">

    <aside class="sidebar" id="sidebar">
      <nav class="nav-menu">
        <div class="menu-title">功能列表</div>
        <ul id="sidebar-items">
          <!-- 由 app.js 依 teacher_ops.json 產生 -->
          <li class="nav-item active">Dashboard</li>
        </ul>
      </nav>
    </aside>

    <main class="main-content" id="main">
      <h1 class="page-title">儀表板 (Dashboard)</h1>
      <section class="card-grid" id="card-container">
        <!-- 載入前的佔位卡片 -->
        <article class="card">
          <h3>課程管理</h3>
          <p>載入中...</p>
        </article>
      </section>
    </main>

  </div>

  <!-- 3. Footer -->
  <footer class="main-footer">
    <p>&copy; 2026 WKE 教務系統</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
